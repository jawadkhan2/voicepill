<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VoicePill</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body class="main-body">
    <div id="app" class="app-shell" data-view="transcripts">
      <header class="app-header" data-tauri-drag-region>
        <div class="app-heading" data-tauri-drag-region>
          <div class="brand" data-tauri-drag-region>
            <svg class="brand-mark" viewBox="14 36 100 56" aria-hidden="true">
              <defs>
                <linearGradient id="brand-grad" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0" stop-color="#52525B" />
                  <stop offset="1" stop-color="#27272E" />
                </linearGradient>
              </defs>
              <rect x="18" y="40" width="92" height="48" rx="24" fill="url(#brand-grad)" />
              <g fill="#fff">
                <rect x="36" y="56" width="6" height="16" rx="3" />
                <rect x="50" y="50" width="6" height="28" rx="3" />
                <rect x="64" y="44" width="6" height="40" rx="3" />
                <rect x="78" y="50" width="6" height="28" rx="3" />
                <rect x="92" y="56" width="6" height="16" rx="3" />
              </g>
            </svg>
            <h1 class="settings-title" data-tauri-drag-region>VoicePill</h1>
          </div>
          <p class="settings-sub" id="app-sub" data-tauri-drag-region>Recent transcriptions</p>
        </div>
        <div class="header-controls">
          <button
            id="nav-toggle"
            class="icon-btn nav-toggle"
            type="button"
            title="Open settings"
            aria-label="Open settings"
          >
            <svg class="nav-icon gear-icon" aria-hidden="true" viewBox="0 0 24 24">
              <path d="M12 15.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4Z" />
              <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 0 1 0 2.8 2 2 0 0 1-2.8 0l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6v.2a2 2 0 0 1-4 0V21a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 0 1-2.8 0 2 2 0 0 1 0-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.6-1H2.8a2 2 0 0 1 0-4H3a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9L4.2 7a2 2 0 0 1 0-2.8 2 2 0 0 1 2.8 0l.1.1a1.7 1.7 0 0 0 1.9.3A1.7 1.7 0 0 0 10 3V2.8a2 2 0 0 1 4 0V3a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 0 1 2.8 0 2 2 0 0 1 0 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1h.2a2 2 0 0 1 0 4H21a1.7 1.7 0 0 0-1.6 1Z" />
            </svg>
            <svg class="nav-icon back-icon" aria-hidden="true" viewBox="0 0 24 24">
              <path d="M15 18l-6-6 6-6" />
            </svg>
          </button>

          <div class="win-controls">
            <button id="win-min" class="win-btn" type="button" title="Minimize" aria-label="Minimize">
              <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 6h8" /></svg>
            </button>
            <button id="win-max" class="win-btn" type="button" title="Maximize" aria-label="Maximize">
              <svg class="max-icon" viewBox="0 0 12 12" aria-hidden="true"><rect x="2" y="2" width="8" height="8" rx="1" /></svg>
              <svg class="restore-icon" viewBox="0 0 12 12" aria-hidden="true"><rect x="2" y="3.5" width="6.5" height="6.5" rx="1" /><path d="M4 3.5V2.5h6.5V9h-1" /></svg>
            </button>
            <button id="win-close" class="win-btn win-close" type="button" title="Close" aria-label="Close">
              <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M3 3l6 6M9 3l-6 6" /></svg>
            </button>
          </div>
        </div>
      </header>

      <!-- Edge/corner grips give the borderless window its resize handles. -->
      <div class="resize-grips" aria-hidden="true">
        <div class="grip grip-n" data-dir="North"></div>
        <div class="grip grip-s" data-dir="South"></div>
        <div class="grip grip-e" data-dir="East"></div>
        <div class="grip grip-w" data-dir="West"></div>
        <div class="grip grip-ne" data-dir="NorthEast"></div>
        <div class="grip grip-nw" data-dir="NorthWest"></div>
        <div class="grip grip-se" data-dir="SouthEast"></div>
        <div class="grip grip-sw" data-dir="SouthWest"></div>
      </div>

      <div class="view-stack">
        <section id="view-transcripts" class="view">
          <div class="view-inner history">
            <main id="history-root" class="history-list"></main>
          </div>
        </section>
        <section id="view-settings" class="view">
          <div class="view-inner settings">
            <div id="settings-root"></div>
          </div>
        </section>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
