name: Build macOS Apple Silicon Release Asset

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the DMG to, for example v0.1.4"
        required: true
        type: string
      version:
        description: "Release version, for example 0.1.4"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-macos-apple-silicon:
    name: Build Apple Silicon DMG
    runs-on: macos-14

    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Prepare Rust target
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
          rustup target add aarch64-apple-darwin

      - name: Build macOS Apple Silicon DMG
        run: npm run build:mac:apple-silicon

      - name: Upload DMG to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          dmg="$(find src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -name '*.dmg' -print -quit)"
          if [[ -z "$dmg" ]]; then
            echo "No DMG found"
            find src-tauri/target/aarch64-apple-darwin/release/bundle -maxdepth 3 -type f || true
            exit 1
          fi
          asset="VoicePill_${VERSION}_aarch64.dmg"
          cp "$dmg" "$asset"
          gh release upload "$TAG" "$asset" --repo "$GITHUB_REPOSITORY" --clobber
