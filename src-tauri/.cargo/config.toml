# Build-time environment for native deps. Cargo applies `[env]` to every build
# script and rustc invocation, so this works no matter how cargo is launched
# (`cargo build`, `tauri dev`, `tauri build`) — unlike a Windows User env var,
# which Git Bash and some spawned shells don't inherit.
#
# - whisper-rs-sys must generate bindings on Windows/MSVC. Its bundled
#   bindings are Linux-shaped and fail layout checks for FILE/_IO types.
# - GGML_NATIVE=OFF: keep release builds portable across CPUs instead of tuning
#   native code for only this build machine.
# - CMAKE_CUDA_ARCHITECTURES: when the Windows CUDA backend is active, build
#   kernels for distributable NVIDIA generations instead of only the GPU
#   attached to this machine. RTX 2070 is Turing/sm_75; RTX 30xx is sm_86;
#   RTX 40xx is sm_89; RTX 50xx is sm_120/121.
[env]
GGML_NATIVE = "OFF"
CMAKE_CUDA_ARCHITECTURES = "75-virtual;80-virtual;86-real;89-real;120a-real;121a-real"
